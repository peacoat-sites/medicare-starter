baseURL = "https://medicarestarter.com/"
enableGitInfo = true
languageCode = "en-us"
title = "Medicare Starter"
[pagination]
  pagerSize = 12
enableRobotsTXT = true
enableEmoji = true

[params]
  description = "Your plain-English guide to Medicare - plans, enrollment, costs, and coverage explained simply for new and existing enrollees."
  niche = "Medicare & Senior Health Insurance"
  adsense_id = "ca-pub-3466203197759215"
  adsense_slot_header = "auto"
  adsense_slot_incontent = "auto"
  adsense_slot_sidebar = "auto"
  image_query = "senior health insurance medicare"
  author = "Medicare Starter Editorial Team"
  logo_text = "Medicare Starter"
  tagline = "Medicare Made Clear"
  primary_color = "#1a2744"
  cloudflare_analytics = ""

  # Authority theme
  hero_color_1 = "#0c1a14"
  hero_color_2 = "#1a2744"
  hero_color_3 = "#b45309"
  hero_color_4 = "#92400e"
  monthly_readers = 62000
  research_hours  = 480
  satisfaction    = 96
  trust_extra     = "Licensed insurance professionals"
  impact_verification = ""
  impact_tracking_id  = "" 

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.5
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[permalinks]
  posts = "/:slug/"

[related]
  includeNewer = true
  threshold    = 80
  toLower      = false
  [[related.indices]]
    name   = "keywords"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 50
